[package]
name = "setlist"
version = "0.1.0"
description = "Praise team command center: setlists, ChordPro charts, one-tap transposition"
edition = "2021"

[lib]
name = "setlist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
